name: Bundle checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-check:
    name: bundle-check (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-09-19
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, verified 2026-09-19
        with:
          python-version: ${{ matrix.python }}
      - name: Check bundle structure and configuration
        run: python3 -B validation/check_bundle.py --mode bundle
      - name: Run regression tests
        run: python3 -B -m unittest discover -s validation/tests -v
      - name: Check task receipts and derived overview
        run: |
          python3 -B validation/tasks.py check --root .
          python3 -B validation/tasks.py todo --root . --check
      - name: Ensure tracked files were not changed
        run: git diff --exit-code
